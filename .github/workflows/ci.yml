name: QFF repository checks

on:
  push:
    branches: [main, phase2/readiness-scaffold]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qff-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install pinned project and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile source modules
        run: python -m py_compile src/*.py
      - name: Execute end-to-end benchmark notebook
        run: python -m nbconvert --to notebook --execute --inplace main.ipynb --ExecutePreprocessor.timeout=2400
      - name: Run unit and artifact checks
        run: python -m pytest -q
