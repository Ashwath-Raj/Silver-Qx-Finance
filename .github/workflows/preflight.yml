name: Phase 2 preflight

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_processor_d.py
      - run: python scripts/run_official_processor_validation.py
      - run: python scripts/run_classical_reference.py
      - run: python scripts/run_qaoa_ideal_prototype.py
      - run: python scripts/plot_classical_reference.py
      - run: python scripts/plot_processor_D.py
      - run: python scripts/plot_qaoa_seed_comparison.py
      - run: python -m pytest -q
